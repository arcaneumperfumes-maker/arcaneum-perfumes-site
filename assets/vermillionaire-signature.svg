<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">VERMILLIONAIRE signature artwork</title>
  <desc id="desc">Vermilion citrus peel, salt-lit air, hard sunlight, and warm gold settling toward skin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09110b"/>
      <stop offset="0.32" stop-color="#3b1a12"/>
      <stop offset="0.58" stop-color="#b94b24"/>
      <stop offset="0.8" stop-color="#e3a54d"/>
      <stop offset="1" stop-color="#211810"/>
    </linearGradient>
    <linearGradient id="peel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c1b16"/>
      <stop offset="0.38" stop-color="#e35b24"/>
      <stop offset="0.72" stop-color="#f5a33f"/>
      <stop offset="1" stop-color="#efc06c"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2bd" stop-opacity="0.98"/>
      <stop offset="0.32" stop-color="#f3ca72" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f2b65b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e1ad7f" stop-opacity="0.48"/>
      <stop offset="0.58" stop-color="#a96b4b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#513425" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="21" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.065"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="895" cy="265" r="235" fill="url(#sun)" filter="url(#blur)"/>
  <circle cx="895" cy="265" r="96" fill="#f8d986" fill-opacity="0.82"/>
  <ellipse cx="610" cy="1275" rx="510" ry="300" fill="url(#skin)" filter="url(#blur)"/>
  <path d="M175 920C275 610 505 375 790 350C906 340 980 386 1010 470C1033 535 1004 615 930 665C822 738 687 716 590 796C496 873 493 1016 558 1172" fill="none" stroke="#34130d" stroke-opacity="0.35" stroke-width="118" stroke-linecap="round"/>
  <path d="M175 920C275 610 505 375 790 350C906 340 980 386 1010 470C1033 535 1004 615 930 665C822 738 687 716 590 796C496 873 493 1016 558 1172" fill="none" stroke="url(#peel)" stroke-width="86" stroke-linecap="round"/>
  <path d="M195 900C300 610 510 410 785 382" fill="none" stroke="#ffd08a" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
  <g fill="#fff3cf" fill-opacity="0.58">
    <circle cx="285" cy="300" r="7"/><circle cx="355" cy="430" r="4"/><circle cx="480" cy="270" r="6"/>
    <circle cx="560" cy="520" r="8"/><circle cx="690" cy="250" r="4"/><circle cx="760" cy="810" r="7"/>
    <circle cx="940" cy="860" r="5"/><circle cx="1040" cy="730" r="8"/><circle cx="840" cy="1020" r="6"/>
    <circle cx="320" cy="1110" r="5"/><circle cx="1040" cy="1120" r="4"/><circle cx="690" cy="1190" r="7"/>
  </g>
  <g fill="none" stroke="#f7deb0" stroke-opacity="0.32" stroke-width="4">
    <path d="M95 745C310 705 505 712 700 755C900 799 1045 790 1150 755"/>
    <path d="M45 805C255 770 455 778 655 820C864 864 1037 853 1185 810"/>
    <path d="M100 865C310 840 500 850 685 892C878 935 1018 928 1132 895"/>
  </g>
  <path d="M95 400C150 305 220 245 318 210C275 328 211 405 95 400Z" fill="#294126" fill-opacity="0.62"/>
  <path d="M152 425C235 337 306 298 395 290" fill="none" stroke="#71915a" stroke-opacity="0.42" stroke-width="10" stroke-linecap="round"/>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.62"/>
</svg>