<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">VERMILLIONAIRE signature artwork</title>
  <desc id="desc">Vermilion citrus light, mineral air, bitter green peel, and sun-warmed skin rendered as an atmospheric editorial composition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08100b"/>
      <stop offset="0.34" stop-color="#1c160f"/>
      <stop offset="0.6" stop-color="#4d2115"/>
      <stop offset="0.82" stop-color="#8c3a20"/>
      <stop offset="1" stop-color="#1a120d"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff1bd" stop-opacity="0.9"/>
      <stop offset="0.32" stop-color="#f4ca79" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#e99642" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="verm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ed6b34" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#b84225" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6b261b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e7b56e" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8a5532" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b84a26" stop-opacity="0.14"/>
      <stop offset="0.48" stop-color="#f1843f" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#f5c173" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur65"><feGaussianBlur stdDeviation="65"/></filter>
    <filter id="grain" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" seed="73" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="920" cy="245" r="285" fill="url(#sun)" filter="url(#blur40)"/>
  <circle cx="910" cy="250" r="58" fill="#f6daa0" fill-opacity="0.54"/>
  <ellipse cx="760" cy="635" rx="510" ry="430" fill="url(#verm)" filter="url(#blur65)"/>
  <ellipse cx="625" cy="1230" rx="560" ry="310" fill="url(#gold)" filter="url(#blur65)"/>
  <g opacity="0.95">
    <path d="M86 858C243 540 468 330 804 220C641 424 520 657 456 934C397 1188 402 1288 452 1455" fill="none" stroke="#2a110c" stroke-opacity="0.28" stroke-width="170" stroke-linecap="round"/>
    <path d="M86 858C243 540 468 330 804 220C641 424 520 657 456 934C397 1188 402 1288 452 1455" fill="none" stroke="url(#peel)" stroke-width="116" stroke-linecap="round"/>
    <path d="M109 837C266 550 476 372 760 269" fill="none" stroke="#ffd08b" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g filter="url(#blur40)" opacity="0.5">
    <path d="M96 302C177 183 286 137 420 146C350 292 248 389 102 430C74 389 72 347 96 302Z" fill="#2a482d"/>
    <path d="M85 338C216 301 313 248 396 164" fill="none" stroke="#849861" stroke-opacity="0.4" stroke-width="16" stroke-linecap="round"/>
  </g>
  <g fill="#f6e6c8" fill-opacity="0.35">
    <circle cx="270" cy="268" r="5"/><circle cx="370" cy="406" r="8"/><circle cx="540" cy="236" r="4"/>
    <circle cx="690" cy="430" r="5"/><circle cx="805" cy="355" r="7"/><circle cx="975" cy="525" r="4"/>
    <circle cx="1045" cy="705" r="8"/><circle cx="855" cy="790" r="5"/><circle cx="716" cy="905" r="4"/>
    <circle cx="1000" cy="1040" r="6"/><circle cx="635" cy="1125" r="5"/><circle cx="303" cy="1072" r="4"/>
  </g>
  <path d="M100 1005C345 936 570 939 777 1002C938 1051 1060 1064 1180 1027" fill="none" stroke="#f3d7a4" stroke-opacity="0.1" stroke-width="3"/>
  <path d="M70 1060C328 996 551 1008 760 1062C934 1107 1067 1112 1195 1071" fill="none" stroke="#f3d7a4" stroke-opacity="0.07" stroke-width="2"/>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.82"/>
</svg>